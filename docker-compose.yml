version: '3.8'

services:
  # Backend (Node.js / Express) Service
  backend:
    build:
      context: ./backend        
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      # Maps your host machine's port 5000 to the container's port 5000
      - "5000:5000"
    env_file:
      - ./backend/.env  # Loads your backend .env file
    restart: unless-stopped
    networks:
      - jobportal-net

  # Frontend (Vite + React) Service
  frontend:
    build:
      context: ./frontend         
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Maps your host machine's port 5173 to Vite's default port 5173
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    networks:
      - jobportal-net

# Defines the network that allows frontend and backend to communicate
networks:
  jobportal-net:
    driver: bridge