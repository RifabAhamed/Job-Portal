# .github/workflows/deploy-frontend.yml

name: CD - Deploy Frontend to Netlify

# Triggers:
# 1. On pushes to the 'main' branch
# 2. ONLY if files in 'frontend/' changed
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build # This creates the 'frontend/dist' folder

    - name: Deploy to Netlify
      uses: netlify/actions/cli@v1
      with:
        # These are the secrets you set up in Step 1
        auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        site_id: ${{ secrets.NETLIFY_SITE_ID }}
        
        dir: frontend/dist  # Path to your built React app
        prod: true          # This deploys to your main production URL